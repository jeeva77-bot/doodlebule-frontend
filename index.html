<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resume</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      color: #222;
    }
    h1 {
      color: #2563eb;
      font-size: 60px;
      position: relative;
      top: 60px;
    

    }

    h2 {
      border-bottom: 2px solid #2563eb;
      padding-bottom: 5px;
      margin-top: 25px;
    }
    p, li {
      font-size: 26px;
      line-height: 1.6;
    }
    a {
      color: #2563eb;
    }
    img{
     width: 250px;
     height: 250px;
      border-radius: 50%; 
      object-fit: cover;
      margin-left: 2600px;
      margin-top: -130px;
      
    }
  </style>
</head>
<body>
  <header>
    <h1 id="name"></h1>
    <img src="photo.jpeg" alt="">
    <hr>
    <p id="contact"></p>
    <p id="github"></p>
    <p id="linkedin"></p>
  </header>

  <main>
    <h2>Career Objective</h2>
    <p id="objective" ></p>

    <h2>Education</h2>
    <ul id="education"></ul>

    <h2>Technical Skills</h2>
    <ul id="skills"></ul>

    <h2>Academic Work & Mini Task</h2>
    <ul id="projects"></ul>

    <h2>Internship</h2>
    <ul id="internship"></ul>

    <h2>Certifications</h2>
    <ul id="certifications"></ul>

    <h2>Achievements</h2>
    <ul id="achievements"></ul>
  </main>

  <script>
    const userData = {
      name: "Jeeva A",
      phone: "9940430875",
      email: "jeeva23@gmail.com",
      github: "https://github.com/jeevadev",
      linkedin: "https://www.linkedin.com/",
      objective: "To obtain an entry-level position in a reputed organization where I can apply my technical knowledge, enhance my programming skills, learn new technologies, and contribute to the growth of the organization while developing my professional career.",

      education: [
        "B.Tech Information Technology",
        "S.A Engineering College, Chennai | 2023-2027 | CGPA: 8.30/10",
        "Relevant Courses: Data Structures, Algorithms, DBMS, OOP"
      ],

      skills: [
        "Programming Languages: Java (Basic), Python (Basic)",
        "Web Development: HTML, CSS, JavaScript, Node.js",
        "Database: MongoDB (Basic)",
        "Tools & Platforms: VS Code, Figma, AWS Cloud, GitHub, Android Studio, Docker",
        "Core Concepts: OOP, DBMS, Data Structures, Networking, Cloud Computing"
      ],

      projects: [
        {
          title: "Event Coordinator",
          description: "Pixel Craft (UI/UX Design) Symposium"
        },
        {
          title: "E-commerce Website",
          description: "Created a simple e-commerce website using HTML, CSS and basic JavaScript"
        },
        {
          title: "Cloud-Enabled Learning System",
          description: "Architecture of a Cloud-Enabled Learning, Attendance & Assessment System (In Progress)"
        }
      ],

      internship: [
        {
          title: "Cloud Computing Internship - Eagle Tech Company",
          description: "Gained practical knowledge of cloud technologies, deployment concepts, virtualization, Docker and cloud architecture. Enhanced technical, problem-solving and teamwork skills."
        }
      ],

      certifications: [
        "Full Stack Development - Simplilearning (2025)",
        "Java - NPTEL (2024)",
        "Typewriting - 2024, First Class with Distinction"
      ],

      achievements: [
        "Participated in an Inter-College Hackathon"
      ]
    };

    document.getElementById("name").innerText = userData.name;
    document.getElementById("contact").innerHTML =
      `<strong>Phone:</strong> ${userData.phone} | <strong>Email:</strong> ${userData.email}`;

    document.getElementById("github").innerHTML =
      `<strong>GitHub:</strong> <a href="${userData.github}">${userData.github}</a>`;

    document.getElementById("linkedin").innerHTML =
      `<strong>LinkedIn:</strong> <a href="${userData.linkedin}">LinkedIn Profile</a>`;

    document.getElementById("objective").innerText = userData.objective;

    document.getElementById("education").innerHTML =
      userData.education.map(item => `<li>${item}</li>`).join("");

    document.getElementById("skills").innerHTML =
      userData.skills.map(skill => `<li>${skill}</li>`).join("");

    document.getElementById("projects").innerHTML =
      userData.projects.map(project =>
        `<li><strong>${project.title}</strong> - ${project.description}</li>`
      ).join("");

    document.getElementById("internship").innerHTML =
      userData.internship.map(item =>
        `<li><strong>${item.title}</strong><p>${item.description}</p></li>`
      ).join("");

    document.getElementById("certifications").innerHTML =
      userData.certifications.map(item => `<li>${item}</li>`).join("");

    document.getElementById("achievements").innerHTML =
      userData.achievements.map(item => `<li>${item}</li>`).join("");
  </script>
</body>
</html>
